---
# cPanel Git Version Control — deploy iz klona repozitorijuma u radni direktorijum
# aplikacije. Document root domena/poddomena treba da pokazuje na
# /home/skyvorte/fakture_app/public
#
# Pre commita lokalno pokreni `npm run build` — `public/build` ide u git, jer se
# na sharedu ne oslanjamo na Node.
#
# Putanje su iste kao u spa-booking projektu, koji se uspešno deployuje na ovaj
# isti server: to je CloudLinux alt-php, a ne cPanel ea-php.
deployment:
  tasks:
    - export DEPLOYPATH=/home/skyvorte/fakture_app
    - export PHPBIN=/opt/alt/php84/usr/bin/php
    - export COMPOSERBIN=/usr/local/bin/composer

    # `cp -a *` ne dira skrivene fajlove, pa .env, .git, .ai i .claude ostaju
    # kakvi jesu. vendor/ i node_modules/ nisu u repozitorijumu.
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -a * $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/tests

    # storage/ u repozitorijumu ima samo .gitignore fajlove, pa prvi deploy mora
    # sam da napravi pod-direktorijume koje Laravel očekuje.
    - /bin/mkdir -p $DEPLOYPATH/storage/app/private $DEPLOYPATH/storage/framework/cache/data $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/logs $DEPLOYPATH/bootstrap/cache
    - /bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache

    # Stari keš mora da nestane pre composer install-a, jer package:discover iz
    # post-autoload-dump skripte čita zatečeni packages.php.
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/packages.php $DEPLOYPATH/bootstrap/cache/services.php $DEPLOYPATH/bootstrap/cache/config.php $DEPLOYPATH/bootstrap/cache/compiled.php

    - cd $DEPLOYPATH && $PHPBIN $COMPOSERBIN install --no-dev --optimize-autoloader --no-interaction
